version: '3.8'

services:
  mariadb-test:
    image: mariadb:11
    container_name: mariadb-test
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u testuser -ptestpass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_test_data:
